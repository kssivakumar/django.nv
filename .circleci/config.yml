jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a build step"

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a test step"

  integration:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Integration (non-blocking)
          command: |
            (
              echo "This is an integration step"
              exit 1
            ) || echo "Integration step failed — continuing anyway"

  artifact:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Create artifact file
          command: echo "hello" > hello.txt
      - store_artifacts:
          path: hello.txt

  prod:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a deploy step"

workflows:
  django:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - test:
          requires:
            - build
          filters:
            branches:
              only: main
      - integration:
          requires:
            - test
          filters:
            branches:
              only: main
      - artifact:
          requires:
            - integration
          filters:
            branches:
              only: main
      - prod:
          type: approval
          requires:
            - artifact
          filters:
            branches:
              only: main
